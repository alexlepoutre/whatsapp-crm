expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 20000
; Le code ne change pas dans une image : inutile de vérifier les dates de fichiers.
opcache.validate_timestamps = 0

memory_limit = 128M
post_max_size = 2M
