# Cache navigateur : la feuille de style et les logos sont versionnés dans leur adresse.
map $sent_http_content_type $cache_expires {
    default off;
    text/css 30d;
    font/woff2 1y;
    ~^image/ 7d;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/app/public;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # L'URL de suivi contient le jeton privé du client : elle ne doit pas fuiter vers
    # un site tiers via Referer. Pas "no-referrer", qui enverrait Origin: null sur les POST.
    add_header Referrer-Policy "same-origin" always;

    expires $cache_expires;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Si PHP ne répond plus, Symfony ne peut pas afficher sa page d'erreur.
    error_page 502 503 504 /erreur.html;

    location = /erreur.html {
        internal;
    }

    client_max_body_size 2M;
}
