services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/app:cached
    depends_on:
      - database
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app@database:3306/whatsapp_crm?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
      DEFAULT_URI: "http://localhost:8140"
      WHATSAPP_PUBLIC_NUMBER: "33600000000"
      MAIL_FROM: "Posez votre question <noreply@localhost.test>"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8140:80"
    volumes:
      - .:/var/www/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: whatsapp_crm
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3321:3306"

  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8026:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
