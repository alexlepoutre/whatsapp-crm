# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # 7 jours, comme remember_me. Les fichiers sont hors de /tmp : un volume les garde en production
    # d'un déploiement à l'autre, sinon les formulaires ouverts et l'organisation choisie sont perdus.
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_lifetime: 604800
        gc_maxlifetime: 604800

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

# Derrière Traefik puis nginx. Sans cela, les liens des courriels partiraient en http et
# le limiteur du formulaire verrait la même IP pour tous les visiteurs.
when@prod:
    framework:
        trusted_proxies: 'private_ranges'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
