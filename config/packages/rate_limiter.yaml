framework:
    rate_limiter:
        # Le formulaire est public et envoie un courriel à l'adresse saisie : sans limite,
        # il servirait à bombarder la boîte d'un tiers.
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        tracking_reply:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            contact:
                policy: sliding_window
                limit: 1000
                interval: '1 hour'
            tracking_reply:
                policy: sliding_window
                limit: 1000
                interval: '1 hour'
